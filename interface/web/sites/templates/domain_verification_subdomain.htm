<div class="page-header">
    <h1> {tmpl_var name='new_subdomain_as_maindomain_txt'} </h1>
</div>
<div class="panel panel-default" style="padding:25px">

    <div class="form-group">
        <label for="domain_id" class="col-sm-3 control-label">{tmpl_var name='domain_txt'}</label>
        <div class="col-sm-9">
            <select name="domain_id" id="domain_id" class="form-control">
                {tmpl_var name='domain_option'}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="host" class="col-sm-3 control-label">{tmpl_var name='host_txt'}</label>
        <div class="col-sm-9">
            <input type="text" name="host" id="host" class="form-control">
        </div>
    </div>

    <div class="clear">
        <div class="right">
            <button class="btn btn-default formbutton-success" type="button" value="{tmpl_var name='btn_check_txt'}" data-submit-form="pageForm" data-form-action="sites/domain_verification_subdomain.php">{tmpl_var name='btn_save_txt'}</button>
            <button class="btn btn-default formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-load-content="sites/domain_verification_list.php">{tmpl_var name='btn_cancel_txt'}</button>
        </div>
    </div>
</div>
